; Workers de file d'attente du backend CAPE : envoi des mails (App\Jobs\SendMailJob).
;
; Installation sur le serveur (une fois) :
;   sudo apt install supervisor
;   sudo cp deploy/supervisor/cape-queue-worker.conf /etc/supervisor/conf.d/
;   -> adapter `command`, `directory`, `user` et `stdout_logfile` ci-dessous
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status cape-queue-worker:*
;
; Le .env du serveur doit contenir QUEUE_CONNECTION=database, et la migration
; des tables de file (jobs, failed_jobs) doit être passée.
;
; À chaque déploiement, après `php artisan migrate` :
;   php artisan queue:restart
; (les workers finissent leur mail en cours, puis supervisor les relance sur le
; nouveau code).
;
; Mails en échec après 3 tentatives : `php artisan queue:failed`, puis
; `php artisan queue:retry all` une fois le SMTP rétabli.

[program:cape-queue-worker]
process_name=%(program_name)s_%(process_num)02d
; Chemin de l'application sur le serveur, à adapter.
command=php /var/www/cape_backend/artisan queue:work --queue=mails,notifications,default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/cape_backend
; Même utilisateur que PHP-FPM, pour les droits sur storage/.
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
; Laisse un envoi en cours se terminer avant l'arrêt.
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/cape_backend/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
